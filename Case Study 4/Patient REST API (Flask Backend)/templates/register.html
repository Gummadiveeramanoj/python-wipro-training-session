<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>
</head>
<body>
<h2>Patient Registration</h2>

<form id="patientForm">
    Name: <input type="text" id="name"><br><br>
    Age: <input type="number" id="age"><br><br>

    Gender:
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female <br><br>

    Contact: <input type="text" id="contact"><br><br>
    Disease: <input type="text" id="disease"><br><br>

    Doctor:
    <select id="doctor">
        <option>Dr. Smith</option>
        <option>Dr. Kumar</option>
    </select><br><br>

    <button type="button" onclick="submitForm()">Submit</button>
</form>

<script>
function submitForm() {
    fetch("http://127.0.0.1:5000/api/patients", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            age: document.getElementById("age").value,
            gender: document.querySelector('input[name="gender"]:checked').value,
            contact: document.getElementById("contact").value,
            disease: document.getElementById("disease").value,
            doctor: document.getElementById("doctor").value
        })
    }).then(res => res.json()).then(data => alert("Patient Added"));
}
</script>
</body>
</html>
